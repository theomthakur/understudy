services:
  - type: web
    name: understudy-capability-studio
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeployTrigger: off
    envVars:
      - key: UNDERSTUDY_PUBLIC_DEMO
        value: "1"
      - key: NODE_ENV
        value: production
